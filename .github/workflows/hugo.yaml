name: Build and Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.146.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false   # 明确禁用子模块
          fetch-depth: 0

      # ★★★ 新增步骤：清除所有可能干扰的残留记录 ★★★
      - name: Cleanup Git metadata
        run: |
          # 强制移除任何可能残留的子模块配置（即使文件不存在）
          git config --local --remove-section submodule.themes/hextra 2>/dev/null || true
          git config --local --remove-section submodule 2>/dev/null || true
          rm -rf .git/modules 2>/dev/null || true
          # 创建 .nojekyll 文件，彻底禁止 Jekyll
          touch .nojekyll

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        run: |
          hugo mod get -u
          hugo mod tidy
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4